apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-platform.fullname" . }}-config
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.gateway.env.LOG_LEVEL | default "INFO" | quote }}
  CORS_ORIGINS: {{ .Values.gateway.env.CORS_ORIGINS | default "" | quote }}
  {{- if .Values.observability.tracing.enabled }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.observability.tracing.endpoint | quote }}
  {{- end }}
