{{- if not .Values.secrets.externalSecret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-platform.fullname" . }}-secrets
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.jwtSecret }}
  jwt_secret: {{ .Values.secrets.jwtSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.anthropicApiKey }}
  anthropic_api_key: {{ .Values.secrets.anthropicApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.openaiApiKey }}
  openai_api_key: {{ .Values.secrets.openaiApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.databaseUrl }}
  database_url: {{ .Values.secrets.databaseUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.redisUrl }}
  redis_url: {{ .Values.secrets.redisUrl | quote }}
  {{- end }}
{{- else }}
# External secrets are enabled - secrets managed by external-secrets operator
# Ensure ExternalSecret CRD is installed and configured with the secret store:
#   secretStore: {{ .Values.secrets.externalSecret.secretStore }}
#   remoteRef: {{ .Values.secrets.externalSecret.remoteRef }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "ai-platform.fullname" . }}-secrets
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.secrets.externalSecret.secretStore }}
    kind: SecretStore
  target:
    name: {{ include "ai-platform.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: jwt_secret
      remoteRef:
        key: {{ .Values.secrets.externalSecret.remoteRef }}
        property: jwt_secret
    - secretKey: anthropic_api_key
      remoteRef:
        key: {{ .Values.secrets.externalSecret.remoteRef }}
        property: anthropic_api_key
    - secretKey: openai_api_key
      remoteRef:
        key: {{ .Values.secrets.externalSecret.remoteRef }}
        property: openai_api_key
    - secretKey: database_url
      remoteRef:
        key: {{ .Values.secrets.externalSecret.remoteRef }}
        property: database_url
    - secretKey: redis_url
      remoteRef:
        key: {{ .Values.secrets.externalSecret.remoteRef }}
        property: redis_url
{{- end }}
