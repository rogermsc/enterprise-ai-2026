apiVersion: v2
name: ai-platform
description: Enterprise AI Agent Orchestration Platform

type: application
version: 1.0.0
appVersion: "1.0.0"

keywords:
  - ai
  - llm
  - agents
  - enterprise
  - orchestration

maintainers:
  - name: Good AI
    email: platform@goodai.com

dependencies:
  - name: postgresql
    version: "13.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled

  - name: redis
    version: "18.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
